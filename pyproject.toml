[project]
name = "knowledge-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.3",
    "langchain-text-splitters>=1.1.2",
    "notion-client>=3.1.0",
    "openai>=2.54.0",
    "pip-system-certs>=5.3",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
]

[project.scripts]
knowledge-base = "knowledge_base:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
